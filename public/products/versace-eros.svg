<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5FB"/>
      <stop offset="1" stop-color="#DBE6F1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DBE6F1"/>
      <stop offset="1" stop-color="#2F5680" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3CDEA"/>
      <stop offset="1" stop-color="#4C7BB4"/>
    </linearGradient>
    <linearGradient id="capg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565664"/>
      <stop offset=".45" stop-color="#2B2B36"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="glassSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".12" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".88" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
    </linearGradient>
    <filter id="blur10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur5" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- studio room -->
  <rect width="800" height="800" fill="url(#wall)"/>
  <rect y="612" width="800" height="188" fill="url(#floor)"/>
  <rect y="610" width="800" height="4" fill="#ffffff" opacity=".35"/>
  <ellipse cx="400" cy="352" rx="300" ry="260" fill="url(#glow)"/>

  <!-- ground shadow + reflection -->
  <ellipse cx="400" cy="668" rx="185" ry="26" fill="#2F5680" opacity=".3" filter="url(#blur10)"/>
  <g transform="translate(0 1336) scale(1 -1)" opacity=".14" filter="url(#blur5)">
    <rect x="330" y="292" width="140" height="266" rx="14" fill="url(#liquid)"/>
  </g>

  <!-- cap -->
  <rect x="352" y="158" width="96" height="92" rx="14" fill="url(#capg)"/>
  <rect x="366" y="170" width="18" height="64" rx="8" fill="#ffffff" opacity=".45"/>
  <path d="M398 164v80M418 164v80" stroke="#ffffff" opacity=".18" stroke-width="3"/>
  <!-- collar -->
  <rect x="366" y="252" width="68" height="16" rx="5" fill="url(#capg)"/>
  <rect x="366" y="252" width="68" height="16" rx="5" fill="#ffffff" opacity=".18"/>

  <!-- neck -->
  <rect x="372" y="264" width="56" height="0" fill="#B3CDEA" opacity=".55" stroke="rgba(255,255,255,.7)" stroke-width="3"/>
  

  <!-- bottle glass + liquid -->
  <rect x="318" y="252" width="164" height="386" rx="20" fill="url(#liquid)" stroke="rgba(255,255,255,.9)" stroke-width="6"/>
  <rect x="330" y="278" width="140" height="342" rx="14" fill="url(#liquid)"/>
  <ellipse cx="400" cy="304" rx="56" ry="12" fill="#ffffff" opacity=".3"/>
  

  <!-- glass vertical light -->
  <rect x="322" y="260" width="156" height="370" rx="20" fill="url(#glassSide)"/>
  <!-- highlights -->
  <rect x="338" y="282" width="16" height="276" rx="8" fill="#ffffff" opacity=".55" filter="url(#blur2)"/>
  <circle cx="350" cy="298" r="9" fill="#ffffff" opacity=".7" filter="url(#blur2)"/>

  <!-- label -->
  <rect x="312" y="424" width="176" height="92" rx="10" fill="#000000" opacity=".12" filter="url(#blur5)"/>
  <rect x="312" y="420" width="176" height="92" rx="10" fill="#FDFCF8"/>
  <rect x="312" y="420" width="176" height="92" rx="10" fill="none" stroke="#2F5680" stroke-opacity=".25" stroke-width="1.5"/>
  <line x1="336" y1="440" x2="464" y2="440" stroke="#C9A227" stroke-opacity=".65" stroke-width="1.5"/>
  <text x="400" y="472" font-size="23" letter-spacing="1.2" fill="#2F5680" text-anchor="middle" font-weight="600">Versace</text>
  <text x="400" y="494" font-size="10" letter-spacing="2.5" fill="#7d7668" text-anchor="middle">EAU DE PARFUM</text>
  <line x1="336" y1="504" x2="464" y2="504" stroke="#C9A227" stroke-opacity=".65" stroke-width="1.5"/>

  <!-- gold dust accents -->
  <g fill="#C9A227" opacity=".55">
    <circle cx="212" cy="228" r="5"/><circle cx="602" cy="196" r="4"/>
    <circle cx="632" cy="540" r="5"/><circle cx="176" cy="520" r="4"/>
  </g>
  <g stroke="#C9A227" stroke-width="2" stroke-linecap="round" opacity=".7">
    <path d="M564 268v24M552 280h24"/>
    <path d="M212 356v20M202 366h20"/>
  </g>
</svg>