<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF3FB"/>
      <stop offset="1" stop-color="#D3E2F2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#B2CBE6"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F3A5C"/>
      <stop offset="1" stop-color="#1F3A5C" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="290" fill="#ffffff" opacity=".38"/>
  <circle cx="400" cy="400" r="218" fill="#ffffff" opacity=".4"/>

  <!-- sparkles -->
  <g fill="#3B6291" opacity=".5">
    <circle cx="235" cy="245" r="7"/><circle cx="585" cy="205" r="5"/>
    <circle cx="620" cy="560" r="6"/><circle cx="190" cy="540" r="5"/>
  </g>
  <g stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" opacity=".8">
    <path d="M560 300v28M546 314h28"/>
    <path d="M215 380v22M204 391h22"/>
  </g>

  <!-- podium -->
  <ellipse cx="400" cy="668" rx="228" ry="34" fill="#1F3A5C" opacity=".12"/>

  <!-- bottle -->
  <rect x="372" y="238" width="56" height="72" fill="url(#glass)" stroke="#3B6291" stroke-opacity=".25" stroke-width="3"/>
  <rect x="352" y="168" width="96" height="82" rx="16" fill="url(#cap)"/>
  <rect x="368" y="184" width="64" height="12" rx="6" fill="#ffffff" opacity=".28"/>
  <rect x="315" y="255" width="170" height="370" rx="26" fill="url(#glass)" stroke="#3B6291" stroke-opacity=".35" stroke-width="4"/>
  <!-- glass highlight -->
  <rect x="318" y="330" width="24" height="255" rx="12" fill="#ffffff" opacity=".6"/>
  <circle cx="345" cy="315" r="10" fill="#ffffff" opacity=".55"/>

  <!-- label -->
  <rect x="310" y="420" width="180" height="86" rx="12" fill="#ffffff" opacity=".9"/>
  <rect x="310" y="420" width="180" height="86" rx="12" fill="none" stroke="#3B6291" stroke-opacity=".3" stroke-width="2"/>
  <text x="400" y="474" font-size="21" letter-spacing="1.5" fill="#1F3A5C" text-anchor="middle" font-weight="600">Jean Paul</text>
  <text x="400" y="494" font-size="11" letter-spacing="3" fill="#3B6291" text-anchor="middle" opacity=".8">EAU DE PARFUM</text>

  <!-- brand footer -->
  <text x="400" y="745" font-size="20" letter-spacing="8" fill="#1F3A5C" text-anchor="middle" opacity=".65">VIOLET</text>
</svg>